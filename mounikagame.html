<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Love Game - MOUNIKA ❤️ SORRY</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      color: #3d3d3d;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      animation: bgPulse 5s infinite alternate;
    }
    canvas {
      background: #fff;
      border: 3px solid #a18cd1;
      box-shadow: 0 0 20px #a18cd1;
      animation: popIn 1s ease-out forwards;
    }
    h1 {
      margin-bottom: 10px;
      color: #b24592;
      text-shadow: 0 0 8px #f15f79;
      animation: float 2s infinite ease-in-out;
    }
    #message {
      margin-top: 10px;
      font-size: 20px;
      color: #ff4081;
      text-shadow: 0 0 5px #ff4081;
    }
    #score {
      margin-top: 5px;
      font-size: 18px;
      color: #6a3093;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      background: #ff4081;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 0 10px #ff4081;
      transition: background 0.3s;
    }
    button:hover {
      background: #ff1a66;
    }
    .controls {
      display: none;
      margin-top: 15px;
    }
    .controls button {
      margin: 5px;
      width: 60px;
      height: 60px;
      font-size: 18px;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      canvas { width: 90vw; height: 90vw; }
      .controls { display: block; }
    }
    @keyframes bgPulse {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>❤️ Snake Apology Game ❤️</h1>
  <canvas id="game" width="600" height="600"></canvas>
  <div id="score">Score: 0 | High Score: 0</div>
  <div id="message"></div>
  <button onclick="restartGame()" style="display:none" id="retry">Retry</button>

  <div class="controls">
    <div>
      <button onclick="setDirection('up')">⬆️</button>
    </div>
    <div>
      <button onclick="setDirection('left')">⬅️</button>
      <button onclick="setDirection('down')">⬇️</button>
      <button onclick="setDirection('right')">➡️</button>
    </div>
  </div>

  <audio autoplay loop volume="0.5">
    <source src="https://dl.dropboxusercontent.com/s/8zh0muob0yo6ee0/one-piece-sad-theme.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    let snake, dx, dy, food, letters, collected, gameOver, score, highScore;

    function initGame() {
      snake = [{ x: 10, y: 10 }];
      dx = 1; dy = 0;
      food = getRandomFood();
      letters = ['M','O','U','N','I','K','A','❤️','S','O','R','R','Y'];
      collected = [];
      gameOver = false;
      score = 0;
      highScore = parseInt(localStorage.getItem('highScore')) || 0;
      document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;
      document.getElementById('message').innerText = '';
      document.getElementById('retry').style.display = 'none';
      gameLoop();
    }

    function restartGame() {
      initGame();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
      else if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
      else if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
      else if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
    });

    function setDirection(dir) {
      if (dir === 'up' && dy === 0) { dx = 0; dy = -1; }
      else if (dir === 'down' && dy === 0) { dx = 0; dy = 1; }
      else if (dir === 'left' && dx === 0) { dx = -1; dy = 0; }
      else if (dir === 'right' && dx === 0) { dx = 1; dy = 0; }
    }

    function getRandomFood() {
      return {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
    }

    function gameLoop() {
      if (gameOver) return;
      setTimeout(gameLoop, 300);

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return endGame();
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) return endGame();

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        if (collected.length < letters.length) {
          collected.push(letters[collected.length]);
        }
        food = getRandomFood();
        score++;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('highScore', highScore);
        }
        document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;
        if (collected.length === letters.length) {
          document.getElementById('message').innerText = "I spelled it just for you ❤️: " + collected.join('');
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      gameOver = true;
      document.getElementById('message').innerText = "Game Over 😢";
      document.getElementById('retry').style.display = 'inline-block';
    }

    function draw() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#9b59b6';
      ctx.font = 'bold 18px Arial';
      ctx.fillText(letters[collected.length] || '', food.x * gridSize + 4, food.y * gridSize + 16);

      snake.forEach((seg, idx) => {
        ctx.fillStyle = '#9b59b6';
        ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize, gridSize);
        if (collected[idx]) {
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 14px Arial';
          ctx.fillText(collected[idx], seg.x * gridSize + 4, seg.y * gridSize + 16);
        }
      });
    }

    initGame();
  </script>
</body>
